[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amagi-vaultgraph"
version = "0.1.0"
description = "Turn an Obsidian vault or Claude Code memory folder into one shareable 3D graph HTML file, with an orphan report and link suggestions. Names only, never note text."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "AmagiLabs (Amagisolutionsgroup, Inc.)", email = "dev@amagisolutionsgroup.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["obsidian", "graph", "knowledge-graph", "markdown", "wikilinks", "second-brain", "claude-code", "3d", "visualization", "zettelkasten"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/amagilabs/amagi-vaultgraph"
Source = "https://github.com/amagilabs/amagi-vaultgraph"
Issues = "https://github.com/amagilabs/amagi-vaultgraph/issues"

[project.scripts]
vaultgraph = "amagi_vaultgraph.cli:main"
amagi-vaultgraph = "amagi_vaultgraph.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amagi_vaultgraph = ["vendor/*.js", "vendor/*.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
